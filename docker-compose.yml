# Prerequisito: Supabase local corriendo (`npx supabase start`, ver README). Este compose
# YA NO levanta Postgres propio: la API se conecta al Postgres de Supabase local (Auth,
# Realtime y PostgREST del frontend usan esa misma base). `host.docker.internal` es cómo
# un contenedor llega al puerto publicado en el HOST por Supabase (Docker Desktop lo
# soporta out-of-the-box en Windows/Mac).
services:
  api:
    build: .
    container_name: mpv-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "54322"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: disable
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      SUPABASE_JWT_AUDIENCE: authenticated
      SUPABASE_JWKS_URL: http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
      BACKEND_CORS_ORIGINS: "*"
    volumes:
      # Hot-reload en desarrollo.
      - ./src:/code/src:ro
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
