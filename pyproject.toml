[project]
name = "api-medicos-por-venezuela"
version = "0.1.0"
description = "API REST (FastAPI async) de Médicos por Venezuela sobre PostgreSQL/Supabase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.10.1",
    "httpx>=0.28.1",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: usar Depends()/Query() como valor por defecto es el patrón idiomático de
# FastAPI para inyección de dependencias; no es un error en este contexto.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Un único event loop por sesión: el engine async (a nivel de módulo) y sus
# conexiones asyncpg quedan ligados a un solo loop (evita "Future attached to a
# different loop" entre tests).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Los tests marcados con `live` llaman a servicios externos reales (FPV, etc.)
# y se excluyen del run normal. Ejecutar con: pytest -m live -v
addopts = "-m 'not live'"
markers = ["live: tests de integración real contra servicios externos (requieren internet)"]

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py"]
# SQLAlchemy async ejecuta el trabajo de BD dentro de greenlets; sin esto coverage
# no rastrea el código que corre tras cada await y reporta falsos negativos.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
